  Place the Java code in: app/src/main/java/com/example/stocktradingapp/MainActivity.java
-->
<?xml version="1.0" encoding="utf-8"?>
<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:padding="16dp"
    android:background="#121212">

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical">

        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="Zerodha Stock Trading Simulator"
            android:textColor="#00E676"
            android:textSize="22sp"
            android:textStyle="bold"
            android:gravity="center"
            android:paddingBottom="16dp" />

        <EditText
            android:id="@+id/etUser"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:hint="Trader Name"
            android:textColorHint="#888888"
            android:textColor="#FFFFFF" />

        <EditText
            android:id="@+id/etSymbol"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:hint="Stock Symbol (e.g., RELIANCE, TCS)"
            android:textColorHint="#888888"
            android:textColor="#FFFFFF" />

        <EditText
            android:id="@+id/etQty"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:hint="Quantity"
            android:inputType="number"
            android:textColorHint="#888888"
            android:textColor="#FFFFFF" />

        <EditText
            android:id="@+id/etPrice"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:hint="Price"
            android:inputType="numberDecimal"
            android:textColorHint="#888888"
            android:textColor="#FFFFFF" />

        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="horizontal"
            android:paddingTop="12dp">

            <Button
                android:id="@+id/btnBuy"
                android:layout_width="0dp"
                android:layout_weight="1"
                android:layout_height="wrap_content"
                android:text="PLACE BUY ORDER"
                android:backgroundTint="#00C853"
                android:textColor="#FFFFFF" />

            <Button
                android:id="@+id/btnSell"
                android:layout_width="0dp"
                android:layout_weight="1"
                android:layout_height="wrap_content"
                android:text="PLACE SELL ORDER"
                android:backgroundTint="#D50000"
                android:textColor="#FFFFFF"
                android:layout_marginStart="8dp" />
        </LinearLayout>

        <Button
            android:id="@+id/btnMatch"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="MATCH ORDERS (ORDER BOOK)"
            android:backgroundTint="#2979FF"
            android:textColor="#FFFFFF"
            android:layout_marginTop="8dp" />

        <TextView
            android:id="@+id/tvOrderBook"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="Order Book &amp; Trade Matching Output will appear here..."
            android:textColor="#CCCCCC"
            android:textSize="14sp"
            android:paddingTop="16dp"
            android:fontFamily="monospace" />

    </LinearLayout>
</ScrollView>
